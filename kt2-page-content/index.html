<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Котики ищут дом — КТ №2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" class="sprite" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.8l2.75 5.9 6.45.75-4.78 4.4 1.28 6.37L12 17.02l-5.7 3.2 1.28-6.37L2.8 9.45l6.45-.75L12 2.8z"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.5h2c.7-1.4 2.2-2.5 4.3-2.5 3.7 0 5.8 3.7 4.3 7.2C19.5 16.4 12 21 12 21z"/></symbol>
</svg>

<main class="page">
  <a class="crumb" href="../">‹ Контрольные точки</a>
  <header class="intro">
    <p class="eyebrow">КТ №2 · Работа с контентом</p>
    <h1>Котики ищут дом</h1>
    <p class="lede" id="summary">Каждый из&nbsp;них привит, приучен к&nbsp;лотку и&nbsp;ждёт своего человека.</p>
  </header>

  <div class="toolbar">
    <div class="segmented" role="radiogroup" aria-label="Показать">
      <button type="button" role="radio" aria-checked="true" data-filter="all">Все</button>
      <button type="button" role="radio" aria-checked="false" data-filter="favourite">Любимцы</button>
    </div>
    <label class="sort">
      <span>Сортировка</span>
      <select id="sort">
        <option value="rate">По рейтингу</option>
        <option value="age">Сначала младшие</option>
        <option value="name">По имени</option>
      </select>
    </label>
  </div>

  <ul class="grid" id="cats" role="list"></ul>
  <p class="empty" id="empty" hidden>Здесь пока никого нет.</p>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-name">
  <form method="dialog" class="sheet-close"><button aria-label="Закрыть">Готово</button></form>
  <img id="sheet-img" alt="">
  <div class="sheet-body">
    <p class="badge" id="sheet-badge"><svg><use href="#heart"/></svg>Любимец приюта</p>
    <h2 id="sheet-name"></h2>
    <p class="meta" id="sheet-meta"></p>
    <p class="stars" id="sheet-stars"></p>
    <p id="sheet-desc"></p>
  </div>
</dialog>

<script type="module" src="main.js"></script>
</body>
</html>
